<!-- Site-wide password gate, loaded in <head> on every page via
     include-in-header in _quarto.yml. Client-side only: it keeps the
     course reader from being casually opened without the course password,
     but it is NOT real access control - the page content and this hash
     are still delivered to the browser (and live in the public repo).

     To change the password: pick a new one, run
       python3 -c "import hashlib; print(hashlib.sha256('emne1|NEWPASSWORD'.encode()).hexdigest())"
     and put the output into E1_HASH below. Bump E1_KEY (v1 -> v2) to force
     everyone to re-enter. -->
<style>
html.e1-locked body > * { display: none !important; }
html.e1-locked body { background: #0d1f4f !important; }
#e1-gate { display: flex !important; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; background: #0d1f4f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#e1-gate .e1-card { background: #ffffff; color: #1a2433; border-radius: 10px; padding: 2rem 2.2rem; max-width: 22rem; width: calc(100% - 2rem); box-shadow: 0 12px 40px rgba(0,0,0,.35); text-align: center; border-top: 4px solid #d8973c; }
#e1-gate h1 { font-size: 1.15rem; margin: 0 0 .3rem; color: #0d1f4f; }
#e1-gate p { font-size: .85rem; color: #5b6b73; margin: 0 0 1.1rem; }
#e1-gate input { width: 100%; box-sizing: border-box; font-size: 1rem; padding: .55rem .7rem; border: 1px solid #8d99ae; border-radius: 6px; margin-bottom: .7rem; background: #fff; color: #1a2433; }
#e1-gate input:focus { outline: 2px solid #d8973c; border-color: #d8973c; }
#e1-gate button { width: 100%; font-size: .95rem; font-weight: 600; padding: .55rem; border: 0; border-radius: 6px; background: #0d1f4f; color: #fff; cursor: pointer; }
#e1-gate button:hover { background: #1a3266; }
#e1-gate .e1-err { color: #bf3d37; font-size: .82rem; min-height: 1.1rem; margin: .5rem 0 0; font-weight: 600; }
#e1-gate.e1-shake .e1-card { animation: e1shake .3s; }
@keyframes e1shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
</style>
<script>
(function () {
  var KEY = 'emne1-gate-v1';
  var SALT = 'emne1|';
  var HASH = 'd5505c170752a59150904d5775f17fd549af2070e8c3207b25946b7449a3ddfa';
  try { if (localStorage.getItem(KEY) === HASH) return; } catch (e) { /* storage blocked: gate every load */ }
  document.documentElement.classList.add('e1-locked');

  function sha256hex(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }

  function unlock(gate) {
    try { localStorage.setItem(KEY, HASH); } catch (e) {}
    document.documentElement.classList.remove('e1-locked');
    if (gate) gate.remove();
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!document.documentElement.classList.contains('e1-locked')) return;
    var gate = document.createElement('div');
    gate.id = 'e1-gate';
    gate.innerHTML =
      '<div class="e1-card">' +
      '<h1>Emne 1 - Course Reader</h1>' +
      '<p>This reader is for course participants. Enter the course password from the first lecture.</p>' +
      '<input type="password" id="e1-pw" autocomplete="current-password" placeholder="Course password" autofocus>' +
      '<button type="button" id="e1-go">Open the reader</button>' +
      '<p class="e1-err" id="e1-err"></p>' +
      '</div>';
    document.body.appendChild(gate);
    var input = gate.querySelector('#e1-pw');
    var err = gate.querySelector('#e1-err');
    function attempt() {
      var v = input.value;
      if (!v) { input.focus(); return; }
      if (!(window.crypto && crypto.subtle)) { err.textContent = 'This browser cannot verify the password (no HTTPS?).'; return; }
      sha256hex(SALT + v).then(function (h) {
        if (h === HASH) { unlock(gate); return; }
        err.textContent = 'Wrong password - ask in the lecture or the afternoon session.';
        gate.classList.remove('e1-shake');
        void gate.offsetWidth;
        gate.classList.add('e1-shake');
        input.select();
      });
    }
    gate.querySelector('#e1-go').addEventListener('click', attempt);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(); });
    input.focus();
  });
})();
</script>
