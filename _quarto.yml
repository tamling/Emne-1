project:
  type: book
  output-dir: _site

book:
  title: "Emne 1 — Course Reader"
  subtitle: "Cybersecurity, networks, Linux and scripting"
  chapters:
    - index.qmd
    - part: "Module 1 — Cybersecurity Foundations"
      chapters:
        - chapters/01-working-in-cybersecurity.qmd
        - chapters/02-how-digital-systems-work.qmd
        - chapters/03-thinking-about-risk.qmd
        - chapters/04-what-you-may-and-may-not-do.qmd
    - part: "Module 2 — Networking"
      chapters:
        - chapters/05-what-a-network-is.qmd
        - chapters/06-addresses-subnets-and-names.qmd
        - chapters/07-services-and-their-open-ports.qmd
        - chapters/08-dividing-the-network.qmd
        - chapters/09-routing-and-nat.qmd
        - chapters/10-wireless-why-radio-changes-the-rules.qmd
    - part: "Module 3 — Linux and SecOps"
      chapters:
        - chapters/11-finding-your-way-around-linux.qmd
        - chapters/12-finding-the-needle-in-a-log.qmd
        - chapters/13-users-permissions-and-sudo.qmd
        - chapters/14-services-logs-and-hardening-ssh.qmd
    - part: "Module 4 — Scripting and Automation"
      chapters:
        - chapters/15-writing-it-down.qmd
        - chapters/16-deciding-and-repeating.qmd
        - chapters/17-keeping-many-things.qmd
        - chapters/18-functions-and-file-reading.qmd
        - chapters/19-writing-results-to-files-and-building-a-report.qmd
        - chapters/20-error-handling-file-paths-and-reliable-scripts.qmd
        - chapters/21-what-are-databases-basic-sql.qmd
        - chapters/22-databases-in-programming-sqlite.qmd
        - chapters/23-bash-variables-conditions-loops-and-repeatable-tasks.qmd
        - chapters/24-bash-a-health-check-for-a-running-machine.qmd
        - chapters/25-html-and-css-basics.qmd
        - chapters/26-dom-forms-input-validation-cookies-and-sql-injection.qmd

format:
  html:
    # Every page gets the light/dark toggle (top right); the dark theme is
    # a first-class build, not a filter — see theme-dark.scss.
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    toc: true
    number-sections: true
