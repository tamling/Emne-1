name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enables GitHub Pages (build type "workflow") on first run, so no
      # manual switch in the repo settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      # Figures are pre-built SVGs (chapters/figures/, sources in _tikz/),
      # so the render needs no LaTeX toolchain.
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
